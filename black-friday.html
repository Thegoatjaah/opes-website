<!-- Tracking with consent gate — Opes Consulting -->
<!-- Nothing loads and nothing is stored until the visitor accepts. -->
<style>
  #opes-consent{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:none;
    background:#fff;border-top:1px solid #e2e8f0;box-shadow:0 -6px 24px rgba(15,23,42,.08);
    font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;color:#0A0C19}
  #opes-consent[data-show="1"]{display:block}
  .opes-consent-in{max-width:1100px;margin:0 auto;padding:16px 20px;
    display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .opes-consent-tx{flex:1 1 320px;font-size:14px;line-height:1.5;margin:0}
  .opes-consent-tx a{color:#0077CC;text-decoration:underline}
  .opes-consent-bt{display:flex;gap:10px;flex-wrap:wrap}
  .opes-consent-bt button{font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    padding:10px 20px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#0A0C19}
  .opes-consent-bt button:hover{border-color:#94a3b8}
  .opes-consent-bt button.opes-yes{background:#0094ff;border-color:#0094ff;color:#fff}
  .opes-consent-bt button.opes-yes:hover{background:#0077CC;border-color:#0077CC}
  @media(max-width:600px){.opes-consent-in{padding:14px 16px}
    .opes-consent-bt{width:100%}.opes-consent-bt button{flex:1}}
</style>

<div id="opes-consent" role="region" aria-label="Cookie choices">
  <div class="opes-consent-in">
    <p class="opes-consent-tx">
      We'd like to use the Meta advertising pixel and HubSpot analytics to measure how well
      our ads work. Both are off unless you say yes, and neither is needed for anything on
      this site to function. See our <a href="privacy-policy.html">privacy policy</a>.
    </p>
    <div class="opes-consent-bt">
      <button type="button" id="opes-no">Decline</button>
      <button type="button" id="opes-yes" class="opes-yes">Accept</button>
    </div>
  </div>
</div>

<script>
(function () {
  var PIXEL_ID  = '2045760476144618';
  var HS_PORTAL = '149303097';
  var CONSENT   = 'opes_consent_v1';
  var ATTRIB    = 'opes_attribution_v1';
  var started   = false;

  function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  /* Keeps the ad click id and UTMs so a booking made later can be traced back to
     the specific ad that produced it. Exposed as window.opesAttribution. */
  function captureAttribution() {
    try {
      var q = new URLSearchParams(window.location.search);
      var keys = ['fbclid','utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
      var out = {}, any = false;
      keys.forEach(function(k){ var v = q.get(k); if (v) { out[k] = v; any = true; } });
      if (any) {
        out.landed_at    = new Date().toISOString();
        out.landing_page = window.location.pathname;
        set(ATTRIB, JSON.stringify(out));
      }
      var saved = get(ATTRIB);
      window.opesAttribution = saved ? JSON.parse(saved) : null;
    } catch(e){}
  }

  /* Clicking through to the booking page is intent, not a booking. Contact, so
     that Schedule below stays a clean signal for people who actually booked. */
  function wireBookingIntent() {
    var links = document.querySelectorAll('a[href*="book.html"]');
    Array.prototype.forEach.call(links, function (a) {
      a.addEventListener('click', function () {
        if (window.fbq) fbq('track', 'Contact', { content_name: 'Book a Call' });
      });
    });
  }

  /* The real conversion. HubSpot's meetings embed posts this to the parent page
     when someone completes a booking, so it fires on our own domain. */
  function wireBookingSuccess() {
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.meetingBookSucceeded !== true) return;
      if (window.fbq) fbq('track', 'Schedule', { content_name: 'Discovery Call' });
    });
  }

  function loadHubSpot() {
    var s = document.createElement('script');
    s.id = 'hs-script-loader'; s.async = true; s.defer = true;
    s.src = 'https://js-eu1.hs-scripts.com/' + HS_PORTAL + '.js';
    document.head.appendChild(s);
  }

  function startTracking() {
    if (started) return;
    started = true;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', PIXEL_ID);
    fbq('track', 'PageView');
    loadHubSpot();
    captureAttribution();
    wireBookingIntent();
    wireBookingSuccess();
  }

  function ready(fn){
    if (document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', fn);
    else fn();
  }

  ready(function () {
    var choice = get(CONSENT);
    if (choice === 'yes') { startTracking(); return; }
    if (choice === 'no')  { return; }

    var bar = document.getElementById('opes-consent');
    if (!bar) return;
    bar.setAttribute('data-show','1');

    document.getElementById('opes-yes').addEventListener('click', function(){
      set(CONSENT,'yes'); bar.removeAttribute('data-show'); startTracking();
    });
    document.getElementById('opes-no').addEventListener('click', function(){
      set(CONSENT,'no'); bar.removeAttribute('data-show');
    });
  });
})();
</script>
<!-- End tracking with consent gate -->
